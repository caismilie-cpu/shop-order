<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>订单后台</title>
 <style>
 *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
 body{padding:16px;background:#f5f5f5}
 .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
 .order-item{border-bottom:1px solid #eee;padding:12px 0}
 .order-item:last-child{border-bottom:none}
 .title{font-weight:bold;margin-bottom:6px}
 .goods{color:#444;font-size:14px;margin:4px 0}
 .total{color:#f44336;font-weight:bold}
 .time{font-size:12px;color:#888;margin-top:4px}
 button{padding:6px 10px;border:none;border-radius:6px;background:#eee;margin-top:6px}
 .del{background:#f44336;color:#fff}
 /* 密码弹窗样式 */
 .login-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999}
 .login-box{background:#fff;padding:24px;border-radius:12px;width:90%;max-width:320px}
 .login-box input{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:6px}
 .login-box button{width:100%;background:#222;color:#fff;padding:10px}
 .hidden{display:none !important;}
 </style>
 </head>
 <body>
 <!-- 密码弹窗 -->
 <div class="login-wrap" id="loginBox">
   <div class="login-box">
     <h4>后台验证</h4>
     <input type="password" id="pwdInput" placeholder="请输入后台密码">
     <button onclick="checkPwd()">确认</button>
   </div>
 </div>
 <!-- 订单内容（默认隐藏） -->
 <div class="card hidden" id="mainContent">
 <h3>全部订单</h3>
 <div id="list"></div>
 </div>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script>
 // ========== 修改这里设置你的密码 ==========
 const ADMIN_PWD = "123456"; 
 function checkPwd(){
   const input = document.getElementById('pwdInput').value;
   if(input === ADMIN_PWD){
     document.getElementById('loginBox').classList.add('hidden');
     document.getElementById('mainContent').classList.remove('hidden');
     // 这里放你原本加载订单、supabase初始化代码
     loadOrderList();
   }else{
     alert("密码错误");
   }
 }
 // 按回车确认密码
 document.getElementById('pwdInput').onkeydown = e=>{
   if(e.key === 'Enter') checkPwd();
 }
 // ====== 你原来的订单加载函数示例 ======
 function loadOrderList(){
   // 这里写你原来读取supabase订单渲染 #list 的代码
 }
 </script>
 </body>
 </html>
