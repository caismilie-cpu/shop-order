<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:16px;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.order-item{border-bottom:1px solid #eee;padding:12px 0}
.order-item:last-child{border-bottom:none}
.title{font-weight:bold;margin-bottom:6px}
.goods{color:#444;font-size:14px;margin:4px 0}
.total{color:#f44336;font-weight:bold}
.time{font-size:12px;color:#888;margin-top:4px}
button{padding:6px 10px;border:none;border-radius:6px;background:#eee;margin-top:6px}
.del{background:#f44336;color:#fff}
</style>
</head>
<body>
<div class="card">
<h3>全部订单</h3>
<div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ca4e7b.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlc291cmNlIjoicm9sZXMvYW5vbiIsImlhdCI6MTc1ODk0MDY1MCwiZXhwIjoyMDc0NTE2NjUwLCJuYmYiOjE3NTg5NDA2NTB9.5zqXbHcD8YdXzRkX8c2hDcZ2a3XbJb8Yl5t3l9zX7c";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadOrders(){
  const {data,error}=await supabase.from("orders").select("*").order("created_at",{asc:false});
  if(error) return alert("读取失败"+error.message);
  const wrap=document.getElementById("list");
  wrap.innerHTML="";
  data.forEach(od=>{
    let goodsText=od.goods.map(g=>`${g.name} ×${g.num}`).join("、");
    let div=document.createElement("div");
    div.className="order-item";
    div.innerHTML=`
      <div class="title">姓名：${od.name}｜电话：${od.tel}</div>
      <div class="goods">商品：${goodsText}</div>
      <div class="total">金额：¥${od.total}</div>
      <div class="time">${od.created_at||""}</div>
      <button class="del" onclick="del('${od.id}')">删除此订单</button>
    `;
    wrap.appendChild(div);
  })
}
async function del(id){
  if(!confirm("确定删除？"))return;
  await supabase.from("orders").delete().eq("id",id);
  loadOrders();
}
loadOrders();
</script>
</body>
</html>
