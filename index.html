<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品下单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:16px;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.info .name{font-weight:bold;font-size:16px}
.info .price{color:#f44336;font-size:14px;margin-top:4px}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:36px;height:36px;border:none;border-radius:6px;background:#eee;font-size:18px;cursor:pointer}
.qty span{width:40px;text-align:center;display:inline-block;font-size:16px}
.total-text{font-size:18px;font-weight:bold;color:#f44336;padding:12px 0}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
#submit{width:100%;padding:14px;border:none;border-radius:8px;background:#f44336;color:#fff;font-size:16px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h3>商品列表</h3>
  <div class="item">
    <div class="info">
      <div class="name">商品A</div>
      <div class="price">¥25</div>
    </div>
    <div class="qty">
      <button onclick="add(0)">+</button>
      <span id="q0">0</span>
      <button onclick="minus(0)">-</button>
    </div>
  </div>
  <div class="item">
    <div class="info">
      <div class="name">商品B</div>
      <div class="price">¥38</div>
    </div>
    <div class="qty">
      <button onclick="add(1)">+</button>
      <span id="q1">0</span>
      <button onclick="minus(1)">-</button>
    </div>
  </div>
  <div class="item">
    <div class="info">
      <div class="name">商品C</div>
      <div class="price">¥16</div>
    </div>
    <div class="qty">
      <button onclick="add(2)">+</button>
      <span id="q2">0</span>
      <button onclick="minus(2)">-</button>
    </div>
  </div>
  <div class="total-text">合计：<span id="total">0</span> 元</div>
</div>

<div class="card">
  <input id="name" placeholder="姓名">
  <input id="phone" type="tel" placeholder="请输入手机号">
  <button id="submit" onclick="submitOrder()">提交订单</button>
</div>

<script>
// 先把加减逻辑写最前面！优先执行，不会被supabase打断
const price = [25,38,16];
const q = [0,0,0];

function add(i){
  q[i]++;
  render();
}
function minus(i){
  if(q[i]>0) q[i]--;
  render();
}
function render(){
  document.getElementById("q0").innerText = q[0];
  document.getElementById("q1").innerText = q[1];
  document.getElementById("q2").innerText = q[2];
  let sum = q[0]*25 + q[1]*38 + q[2]*16;
  document.getElementById("total").innerText = sum;
}

// 后面再加载supabase，就算它报错，加减已经正常了
let supabase = null;
async function initSupabase(){
  try{
    const SUPABASE_URL = "粘贴你的Project URL";
    const SUPABASE_KEY = "粘贴你的anon key";
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')
    supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  }catch(e){
    console.log("supabase加载失败：",e);
  }
}
initSupabase();

async function submitOrder(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const total = q[0]*25 + q[1]*38 + q[2]*16;

  if(!name){alert('请填写姓名');return;}
  if(!phone){alert('请填写手机号');return;}
  if(total <= 0){alert('请至少选一件商品');return;}

  if(!supabase){
    alert("数据库连接失败！检查你的SUPABASE链接和密钥");
    return;
  }

  let goods = [];
  if(q[0]>0) goods.push(`商品A×${q[0]}`);
  if(q[1]>0) goods.push(`商品B×${q[1]}`);
  if(q[2]>0) goods.push(`商品C×${q[2]}`);

  const orderData = {
    name,
    phone,
    goods: goods.join('、'),
    total,
    create_time: new Date().toLocaleString()
  }
  const {error} = await supabase.from('orders').insert(orderData);
  if(error){
    alert("下单失败："+error.message);
  }else{
    alert("✅下单成功！后台可以看到订单");
    q[0]=0;q[1]=0;q[2]=0;
    document.getElementById('name').value='';
    document.getElementById('phone').value='';
    render();
  }
}
</script>
</body>
</html>
