<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品下单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:16px;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.name{font-size:15px}
.price{color:#f44336}
.ctrl{display:flex;gap:8px;align-items:center}
button{width:28px;height:28px;border:none;border-radius:6px;background:#eee;font-size:18px}
.num{width:32px;text-align:center}
.submit{width:100%;padding:14px;border:none;background:#f44336;color:#fff;border-radius:10px;font-size:16px;margin-top:12px}
.total{font-size:16px;font-weight:bold;margin:12px 0}
.form-item{margin:10px 0}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:4px}
</style>
</head>
<body>
<div class="card">
<h3>商品列表</h3>
<div class="item">
<div>
<div class="name">商品A</div>
<div class="price">¥25</div>
</div>
<div class="ctrl">
<button onclick="change(0,-1)">-</button>
<div class="num" id="n0">0</div>
<button onclick="change(0,1)">+</button>
</div>
</div>
<div class="item">
<div>
<div class="name">商品B</div>
<div class="price">¥38</div>
</div>
<div class="ctrl">
<button onclick="change(1,-1)">-</button>
<div class="num" id="n1">0</div>
<button onclick="change(1,1)">+</button>
</div>
</div>
<div class="item">
<div>
<div class="name">商品C</div>
<div class="price">¥16</div>
</div>
<div class="ctrl">
<button onclick="change(2,-1)">-</button>
<div class="num" id="n2">0</div>
<button onclick="change(2,1)">+</button>
</div>
</div>
<div class="total">合计：<span id="sum">0</span> 元</div>
</div>
<div class="card">
<div class="form-item">
<label>姓名</label>
<input id="name" placeholder="请输入姓名">
</div>
<div class="form-item">
<label>电话</label>
<input id="tel" placeholder="请输入手机号">
</div>
<button class="submit" onclick="submitOrder()">提交订单</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ca4e7b.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhNGU3YiIsInJlc291cmNlIjoicm9sZXMvYW5vbiIsImlhdCI6MTc1ODk0MDY1MCwiZXhwIjoyMDc0NTE2NjUwLCJuYmYiOjE3NTg5NDA2NTB9.5zqXbHcD8YdXzRkX8c2hDcZ2a3XbJb8Yl5t3l9zX7c";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const prices = [25,38,16];
const counts = [0,0,0];
function change(i,d){
counts[i] = Math.max(0, counts[i]+d);
document.getElementById("n"+i).innerText = counts[i];
calc();
}
function calc(){
let s = 0;
for(let i=0;i<3;i++) s += counts[i]*prices[i];
document.getElementById("sum").innerText = s;
}
async function submitOrder(){
const name = document.getElementById("name").value.trim();
const tel = document.getElementById("tel").value.trim();
if(!name||!tel) return alert("请填写姓名和手机号");
let list = [];
for(let i=0;i<3;i++) if(counts[i]>0) list.push({name:["商品A","商品B","商品C"][i],num:counts[i],price:prices[i]});
if(list.length===0) return alert("请选择商品");
const total = list.reduce((a,b)=>a+b.num*b.price,0);
const {error} = await supabase.from("orders").insert({name,tel,addr:"无需地址",goods:list,total});
if(error) alert("失败："+error.message);
else {alert("下单成功！");counts.fill(0);calc();document.getElementById("name").value="";document.getElementById("tel").value="";}
}
</script>
</body>
</html>
