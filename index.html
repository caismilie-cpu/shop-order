<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品下单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:16px;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.info .name{font-weight:bold}
.info .price{color:#f44336;font-size:14px}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:28px;height:28px;border:none;border-radius:6px;background:#eee;font-size:16px;cursor:pointer}
.qty input{width:40px;text-align:center;border:1px solid #ddd;border-radius:4px;padding:2px}
.total-text{font-size:18px;font-weight:bold;color:#f44336;padding:12px 0}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
#submit{width:100%;padding:12px;border:none;border-radius:8px;background:#f44336;color:#fff;font-size:16px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h3>商品列表</h3>
  <div class="item">
    <div class="info">
      <div class="name">商品A</div>
      <div class="price">¥25</div>
    </div>
    <div class="qty">
      <button class="minus">-</button>
      <input type="number" class="num" value="0" min="0">
      <button class="plus">+</button>
    </div>
  </div>
  <div class="item">
    <div class="info">
      <div class="name">商品B</div>
      <div class="price">¥38</div>
    </div>
    <div class="qty">
      <button class="minus">-</button>
      <input type="number" class="num" value="0" min="0">
      <button class="plus">+</button>
    </div>
  </div>
  <div class="item">
    <div class="info">
      <div class="name">商品C</div>
      <div class="price">¥16</div>
    </div>
    <div class="qty">
      <button class="minus">-</button>
      <input type="number" class="num" value="0" min="0">
      <button class="plus">+</button>
    </div>
  </div>
  <div class="total-text">合计：<span id="total">0</span> 元</div>
</div>

<div class="card">
  <input id="name" placeholder="姓名">
  <input id="phone" placeholder="请输入手机号">
  <button id="submit">提交订单</button>
</div>

<script>
const priceList = [25,38,16];
const numInputs = document.querySelectorAll('.num');
const plusBtns = document.querySelectorAll('.plus');
const minusBtns = document.querySelectorAll('.minus');
const totalEl = document.getElementById('total');

// 计算总价
function calcTotal(){
  let sum = 0;
  numInputs.forEach((inp,idx)=>{
    let n = Number(inp.value) || 0;
    sum += n * priceList[idx];
  })
  totalEl.innerText = sum;
}

// +按钮
plusBtns.forEach((btn,idx)=>{
  btn.onclick = function(){
    let val = Number(numInputs[idx].value) + 1;
    numInputs[idx].value = val;
    calcTotal();
    console.log("点了+，当前数量：",val)
  }
})
// -按钮
minusBtns.forEach((btn,idx)=>{
  btn.onclick = function(){
    let val = Number(numInputs[idx].value) - 1;
    if(val < 0) val = 0;
    numInputs[idx].value = val;
    calcTotal();
    console.log("点了-，当前数量：",val)
  }
})
numInputs.forEach(inp=>{
  inp.oninput = calcTotal;
})

//提交暂时先只提示
document.getElementById('submit').onclick = function(){
  alert("先把加减调好，再接supabase！")
}
</script>
</body>
</html>
